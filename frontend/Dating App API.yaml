    User:
      type: object
      description: |-
        Serializer for the custom :class:`User` model.

        Only exposes a safe subset of fields by default. Sensitive / administrative
        fields (``password``, ``is_staff``, ``is_superuser``, ``groups``,
        ``user_permissions``, raw ``access_code``) are only returned when the
        current requester is staff.

        ``password`` is write-only and never included in responses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the user.
        username:
          type: string
          description: 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          description: Email format accepted.
          maxLength: 254
        phone_number:
          type: string
          description: +98 or 09** format accepted.
          maxLength: 128
        middle_man_code:
          type: string
          nullable: true
          description: Optional Username or Full Name for middle man reference.
          maxLength: 100
        date_created:
          type: string
          format: date-time
          readOnly: true
          description: The date and time when the user was created.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          description: The date and time when the user joined.
      required:
      - date_created
      - date_joined
      - id
      - phone_number
      - username
    UserCompleteProfile:
      type: object
      description: |-
        Step 2 of the two-step signup flow.

        Updates the user-level profile fields stored directly on the
        :class:`User` model (``first_name``, ``last_name``, ``middle_man_code``,
        ``phone_number``, ``email``).

        The detailed profile sections (PersonalInformation, PhysicalInformation,
        FamilyInformation, FinancialInformation, IntellectualInformation, etc.)
        each have their own dedicated CRUD endpoints and serializers. Call the
        corresponding URL (e.g. ``/api/personal-information/``) to create or update
        those sections.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        middle_man_code:
          type: string
          nullable: true
          description: Optional Username or Full Name for middle man reference.
          maxLength: 100
        phone_number:
          type: string
          description: +98 or 09** format accepted.
          maxLength: 128
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          description: Email format accepted.
          maxLength: 254
    UserRegistrationRequest:
      type: object
      description: |-
        Step 1 of the two-step signup flow.

        Captures the minimal information needed to create a user account:
        ``username``, ``email``, ``phone_number``, ``access_code`` and a
        ``password`` (confirmed via ``password2``). An optional ``middle_man_code``
        is accepted.

        On ``save()`` the user is created through :meth:`UserManager.create_user`,
        which validates and **consumes** the supplied access code.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        phone_number:
          type: string
          minLength: 1
        access_code:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        middle_man_code:
          type: string
          nullable: true
          maxLength: 100
      required:
      - access_code
      - email
      - password
      - password2
      - phone_number
      - username
