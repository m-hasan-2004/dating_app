openapi: 3.0.3
info:
  title: Dating App API
  version: 1.0.0
  description: |-
    REST API for the Dating App.

    Authentication uses **JWT access/refresh tokens delivered via HTTP-only cookies**. After calling `/api/auth/login/` the browser stores the tokens automatically; subsequent requests are authenticated via the `access_token` cookie. Use `/api/auth/refresh/` to obtain a new access token when it expires, and `/api/auth/logout/` to clear the cookies.

    Use the **Login** form above to authenticate. The browser will store the HTTP-only cookies automatically and send them on all subsequent requests.
paths:
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Step 1 of signup. Creates a user account with minimal information
        (username, email, phone number, access code, password). The supplied access
        code is validated and consumed. No tokens are issued here; call /api/auth/login/
        to obtain them.
      summary: Register a new user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - cookieJWTAuth: []
      - {}
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Validates username + password and sets HTTP-only `access_token` and `refresh_token` cookies. Returns the authenticated user's profile. The client does **not** need to store tokens in JavaScript -- the browser sends the `access_token` cookie automatically on subsequent requests. Raw tokens are intentionally **not** returned in the body.

        If a valid session already exists, returns the current user profile with an informational message without re-issuing tokens.
      summary: Log in (set JWT cookies)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieJWTAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Blacklists the refresh token found in the `refresh_token` cookie (or `refresh` in the request body) and deletes both auth cookies. No authentication is required so that logout always succeeds, including after the short-lived access token has expired.

        If no active session is found, returns an informational message without error.
      summary: Log out (clear JWT cookies)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - cookieJWTAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Reads the `refresh_token` cookie (falling back to `refresh` in
        the body), rotates the refresh token (blacklists the old one when blacklisting
        is enabled) and sets new `access_token` / `refresh_token` cookies. The new
        tokens are delivered via cookies only -- the response body just confirms success.
      summary: Refresh access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '401':
          description: Invalid or expired refresh token
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the authenticated user's profile.
      summary: Retrieve the current user
      tags:
      - Auth
      security:
      - cookieJWTAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Updates the editable profile fields (username, first_name, last_name,
        email, phone_number, middle_man_code) and optionally changes the password
        (requires `old_password` + `new_password`).
      summary: Update the current user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
