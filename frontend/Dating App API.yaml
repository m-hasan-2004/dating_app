          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        middle_man_code:
          type: string
          nullable: true
          description: Optional Username or Full Name for middle man reference.
          maxLength: 100
        phone_number:
          type: string
          minLength: 1
          description: +98 or 09** format accepted.
          maxLength: 128
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          description: Email format accepted.
          maxLength: 254
    PatchedUserRequest:
      type: object
      description: |-
        Serializer for the custom :class:`User` model.

        Only exposes a safe subset of fields by default. Sensitive / administrative
        fields (``password``, ``is_staff``, ``is_superuser``, ``groups``,
        ``user_permissions``, raw ``access_code``) are only returned when the
        current requester is staff.

        ``password`` is write-only and never included in responses.
      properties:
        username:
          type: string
          minLength: 1
          description: 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          description: Email format accepted.
          maxLength: 254
        phone_number:
          type: string
          minLength: 1
          description: +98 or 09** format accepted.
          maxLength: 128
        middle_man_code:
          type: string
          nullable: true
          description: Optional Username or Full Name for middle man reference.
          maxLength: 100
        access_code:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
