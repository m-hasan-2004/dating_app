# docker-compose.yml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_app_web
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/backups
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PGPASSWORD=${DB_PASSWORD:-Welcome}
      - DJANGO_SETTINGS_MODULE=dating_app.settings
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-dating_app}
      - DB_USER=${DB_USER:-hasan}
      - DB_PASSWORD=${DB_PASSWORD:-Welcome}
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "python manage.py migrate && 
             python manage.py collectstatic --noinput && 
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:15-alpine
    container_name: dating_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - backup_volume:/backups
    environment:
      POSTGRES_DB: ${DB_NAME:-dating_app}
      POSTGRES_USER: ${DB_USER:-hasan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Welcome}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "5432:5432"
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hasan} -d ${DB_NAME:-dating_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dating_app_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - db
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    name: dating_app_postgres_data
  static_volume:
    name: dating_app_static
  media_volume:
    name: dating_app_media
  backup_volume:
    name: dating_app_backups
  pgadmin_data:
    name: dating_app_pgadmin_data


