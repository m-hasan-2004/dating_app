# docker-compose.yml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_app_web
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/backups
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - DJANGO_SETTINGS_MODULE=dating_app.settings
      - DB_HOST=db
      - DB_NAME=dating_app
      - DB_USER=hasan
      - DB_PASSWORD=Welcome
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "python manage.py migrate && 
             python manage.py collectstatic --noinput && 
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:15-alpine
    container_name: dating_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - backup_volume:/backups
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "5432:5432"
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    name: dating_app_postgres_data
  static_volume:
    name: dating_app_static
  media_volume:
    name: dating_app_media
  backup_volume:
    name: dating_app_backups


