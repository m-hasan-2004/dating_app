        id:
          type: string
          format: uuid
          readOnly: true
          title: شناسه
          description: شناسه منحصر به فرد برای کاربر.
        username:
          type: string
          title: نام کاربری
          description: اجباری. 150 کاراکتر یا کمتر. فقط حروف، اعداد و @/./+/-/_.
