        username:
          type: string
          minLength: 1
          title: نام کاربری
          description: اجباری. 150 کاراکتر یا کمتر. فقط حروف، اعداد و @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: نام
          maxLength: 150
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          title: آدرس ایمیل
          description: فرمت ایمیل پذیرفته می‌شود.
          maxLength: 254
        phone_number:
          type: string
          minLength: 1
          title: شماره تلفن
          description: فرمت +98 یا 09** پذیرفته می‌شود.
          maxLength: 128
        middle_man_code:
          type: string
          nullable: true
          title: کد واسطه
          description: یوزر نیم یا نام کامل شخص واسطه.
          maxLength: 100
