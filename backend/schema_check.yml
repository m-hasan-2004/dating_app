components:
  schemas:
    AccessCode:
      type: object
      description: Serializer for the :class:`AccessCode` model (all fields).
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          format: uuid
          readOnly: true
          title: کد دسترسی
          description: کد دسترسی منحصر به فرد برای ایجاد کاربر.
        active:
          type: boolean
          title: فعال
          description: مشخص می‌کند که آیا کد دسترسی فعال است.
        date_created:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ایجاد
          description: تاریخ و زمان ایجاد کد دسترسی.
      required:
      - code
      - date_created
      - id
    AccessCodeRequest:
      type: object
      description: Serializer for the :class:`AccessCode` model (all fields).
      properties:
        active:
          type: boolean
          title: فعال
          description: مشخص می‌کند که آیا کد دسترسی فعال است.
    AfterMarriageResidenceLocationEnum:
      enum:
      - Exactly Qom
      - Near Qom
      - Mega Cities
      - Anywhere in Iran
      - Villages Near Qom
      - Environs Near Qom
      - Foreign Country
      - Agreement
      type: string
      description: |-
        * `Exactly Qom` - قطعاْ قم
        * `Near Qom` - شهر های نزدیک قم
        * `Mega Cities` - کلان شهر ها
        * `Anywhere in Iran` -  هرجای ایران سرای من است
        * `Villages Near Qom` - روستاهای نزدیک قم
        * `Environs Near Qom` - توابع نزدیک قم
        * `Foreign Country` - خارج از کشور
        * `Agreement` - توافقی
    AfterMarriageResidenceStatusEnum:
      enum:
      - owner
      - mortgage
      - fathers_house
      - mothers_house
      - other
      type: string
      description: |-
        * `owner` - صاحب خانه
        * `mortgage` - رهن
        * `fathers_house` - منزل پدر
        * `mothers_house` - منزل مادر
        * `other` - دیگر
    AgeDifferenceEnum:
      enum:
      - Same
      - Till 3
      - 3 to 7
      - 7 to 10
      - 10 to 15
      - Depends on the Looks
      - Doesn’t Matter
      type: string
      description: |-
        * `Same` - هم سن
        * `Till 3` - تا ۳ سال
        * `3 to 7` - ۳ تا ۷ سال
        * `7 to 10` - ۷ تا ۱۰ سال
        * `10 to 15` - ۱۰ تا ۱۵ سال
        * `Depends on the Looks` - بسته به ظاهر
        * `Doesn’t Matter` - اهمیت ندارد
    AppearanceTypeEnum:
      enum:
      - Religious
      - Norm
      - Cador
      - Manto
      - Sport & Modern
      type: string
      description: |-
        * `Religious` - مذهبی
        * `Norm` - عادی
        * `Cador` - چادری
        * `Manto` - مانتو
        * `Sport & Modern` - اسپرت و بروز
    AssetsEnum:
      enum:
      - house
      - shop
      - land
      - garden
      - factory
      - company
      - motorcycle
      - car
      - gold
      - other
      - none
      type: string
      description: |-
        * `house` - خانه
        * `shop` - مغازه
        * `land` - زمین
        * `garden` - باغ
        * `factory` - کارخانه
        * `company` - شرکت
        * `motorcycle` - موتور
        * `car` - ماشین
        * `gold` - سکه
        * `other` - دیگر
        * `none` - ندارم
    AverageFamilyEducationEnum:
      enum:
      - Under Diploma
      - Diploma
      - Associate Degree
      - Bachelor's
      - Master's
      - Ph.D.
      - Hoze
      type: string
      description: |-
        * `Under Diploma` - زیر دیپلم
        * `Diploma` - دیپلم
        * `Associate Degree` - کاردانی
        * `Bachelor's` - کارشناسی
        * `Master's` - کارشناسی ارشد
        * `Ph.D.` - دکتری
        * `Hoze` - حوزه
    AverageFamilyFinanceEnum:
      enum:
      - Perfect
      - Good
      - Average
      - Weak
      type: string
      description: |-
        * `Perfect` - عالی
        * `Good` - خوب
        * `Average` - متوسط
        * `Weak` - کم
    BirthCertificateInformation:
      type: object
      description: Serializer for :class:`BirthCertificateInformation` (all fields).
      properties:
        id:
          type: integer
          readOnly: true
        national_code:
          type: string
          title: کد ملی
          description: کد ملی خود را وارد کنید.
          maxLength: 10
        birth_certificate_serial:
          type: string
          title: سریال شناسنامه
          description: شماره سریال شناسنامه خود را وارد کنید.
          maxLength: 15
        birth_certificate_location:
          type: string
          title: محل صدور شناسنامه
          description: محل صدور شناسنامه را وارد کنید.
          maxLength: 50
        marriage_experince:
