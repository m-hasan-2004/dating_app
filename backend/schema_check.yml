          minLength: 1
        access_code:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        middle_man_code:
          type: string
          nullable: true
          maxLength: 100
      required:
      - access_code
      - email
      - password
      - password2
      - phone_number
      - username
