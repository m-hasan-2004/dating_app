          maxLength: 150
        first_name:
          type: string
          title: نام
          maxLength: 150
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          title: آدرس ایمیل
          description: فرمت ایمیل پذیرفته می‌شود.
          maxLength: 254
        phone_number:
          type: string
          title: شماره تلفن
          description: فرمت +98 یا 09** پذیرفته می‌شود.
          maxLength: 128
        middle_man_code:
          type: string
          nullable: true
          title: کد واسطه
          description: یوزر نیم یا نام کامل شخص واسطه.
          maxLength: 100
        date_created:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ایجاد
          description: تاریخ و زمان ایجاد کاربر.
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ پیوستن
          description: تاریخ و زمان پیوستن کاربر.
      required:
      - date_created
      - date_joined
      - id
      - phone_number
      - username
