    PatchedUserCompleteProfileRequest:
      type: object
      description: |-
        Step 2 of the two-step signup flow.

        Updates the user-level profile fields stored directly on the
        :class:`User` model (``first_name``, ``last_name``, ``middle_man_code``,
        ``phone_number``, ``email``).

        The detailed profile sections (PersonalInformation, PhysicalInformation,
        FamilyInformation, FinancialInformation, IntellectualInformation, etc.)
        each have their own dedicated CRUD endpoints and serializers. Call the
        corresponding URL (e.g. ``/api/personal-information/``) to create or update
        those sections.
      properties:
        first_name:
          type: string
          title: نام
          maxLength: 150
        last_name:
          type: string
          title: نام خانوادگی
          maxLength: 150
        middle_man_code:
          type: string
          nullable: true
          title: کد واسطه
          description: یوزر نیم یا نام کامل شخص واسطه.
          maxLength: 100
        phone_number:
          type: string
          minLength: 1
          title: شماره تلفن
          description: فرمت +98 یا 09** پذیرفته می‌شود.
          maxLength: 128
        email:
          type: string
          format: email
          nullable: true
          title: آدرس ایمیل
          description: فرمت ایمیل پذیرفته می‌شود.
          maxLength: 254
