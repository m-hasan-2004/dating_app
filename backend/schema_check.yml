openapi: 3.0.3
info:
  title: Dating App API
  version: 1.0.0
  description: |-
    REST API for the Dating App.

    Authentication uses **JWT access/refresh tokens delivered via HTTP-only cookies**. After calling `/api/auth/login/` the browser stores the tokens automatically; subsequent requests are authenticated via the `access_token` cookie. Use `/api/auth/refresh/` to obtain a new access token when it expires, and `/api/auth/logout/` to clear the cookies.

    In Swagger UI you can still use the **Authorize** button with a `Bearer <access_token>` header for testing.
paths:
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      description: Step 1 of signup. Creates a user account with minimal information
        (username, email, phone number, access code, password). The supplied access
        code is validated and consumed. No tokens are issued here; call /api/auth/login/
        to obtain them.
      summary: Register a new user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: Validates username + password and sets HTTP-only `access_token`
        and `refresh_token` cookies. Returns the authenticated user's profile. The
        client does **not** need to store tokens in JavaScript.
      summary: Log in (set JWT cookies)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: Blacklists the refresh token (from the `refresh_token` cookie or
        body) and deletes both auth cookies from the client.
      summary: Log out (clear JWT cookies)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Logout successful
        '400':
          description: Refresh token required
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: Reads the `refresh_token` cookie (or `refresh` in the body), rotates
        the refresh token (blacklists the old one) and sets new `access_token` / `refresh_token`
        cookies.
      summary: Refresh access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          description: Invalid or expired refresh token
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: Returns the authenticated user's profile.
      summary: Retrieve the current user
      tags:
      - Auth
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_auth_me_partial_update
      description: Updates the editable profile fields (username, first_name, last_name,
        email, phone_number, middle_man_code) and optionally changes the password
        (requires `old_password` + `new_password`).
      summary: Update the current user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
